modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="${mod_url}"
logoFile="avernus_logo.png"
credits="${mod_credits}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies."${mod_id}"]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="forgeattachment"
mandatory=true
versionRange="[0.0.1-1.20.1,)"
ordering="AFTER"
side="BOTH"
referralUrl="https://www.curseforge.com/minecraft/mc-mods/forgeattachment/files/9481181"

[[dependencies."${mod_id}"]]
modId="mixinextras"
mandatory=true
versionRange="[0.4.1,)"
ordering="NONE"
side="BOTH"
