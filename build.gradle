plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

group = mod_group_id

// 包内版本号恒带 +build.<编号>，只有 buildAlpha 会把这个编号也写进 jar 文件名
def isAlphaBuild = gradle.startParameter.taskNames.any { it.endsWith('buildAlpha') }
// buildAlpha 用 +1 后的编号构建，成功后把同一编号写回 gradle.properties，
// 使产物里的编号与 properties 始终一致
def buildNumber = mod_build_number.toInteger() + (isAlphaBuild ? 1 : 0)
def baseVersion = "${mod_version}-${minecraft_version}"
version = "${baseVersion}+build.${buildNumber}"

// GameTest 独立源集：只在 gameTestServer 运行，不进入成品 jar
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel") // BlockBench 工程文件
    exclude("**/.cache/**") // datagen 缓存
}

repositories {
    mavenLocal()
    maven {
        name = "Curios"
        url = "https://maven.theillusivec4.top/"
        content { includeGroup "top.theillusivec4.curios" }
    }
    maven {
        name = "JEI"
        url = "https://maven.blamejared.com/"
        content {
            includeGroup "mezz.jei"
            includeGroup "net.mezzdev.config"
        }
    }
    maven {
        name = 'MafuyuNexus'
        url = 'https://maven.sighs.cc/repository/maven-public/'
    }
}

base {
    archivesName = mod_id
}

// Forge 1.20.1 使用 Java 17
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }

    mixin {
        add sourceSets.main, "${mod_id}.refmap.json"
        config "${mod_id}.mixins.json"
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        "${mod_id}_gametest" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gametest)
        }
    }

    runs {
        client1 {
            client()
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
            gameDirectory = project.file('./run/client1')
            programArguments.addAll("--username", "player1")
        }

        client2 {
            client()
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
            gameDirectory = project.file('./run/client2')
            programArguments.addAll("--username", "player2")
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            sourceSet = sourceSets.gametest
            gameDirectory = project.file('./run/gametest')
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach { run ->
            def mod = run.name == 'gameTestServer' ? "${mod_id}_gametest" : mod_id
            run.loadedMods.set([legacyForge.mods.getByName(mod)])
            run.systemProperty 'forge.logging.markers', 'REGISTRIES'
            run.logLevel = org.slf4j.event.Level.DEBUG
        }
    }
}

legacyForge.addModdingDependenciesTo(sourceSets.gametest)

configurations {
    runtimeClasspath.extendsFrom localRuntime
    gametestCompileOnly.extendsFrom compileOnly
    gametestRuntimeClasspath.extendsFrom localRuntime
}

dependencies {
    // 玩家持久化附件：Forge 1.20.1 无 AttachmentType，使用固定正式版的 forgeattachment
    modImplementation "io.zershyan:forgeattachment:${forgeattachment_version}"
    // Curios 为可选依赖：只编译其 API，不嵌入成品
    compileOnly "top.theillusivec4.curios:curios-forge:${curios_version}:api"
    if (curios_dev_runtime.toBoolean()) {
        localRuntime "top.theillusivec4.curios:curios-forge:${curios_version}"
    }
    // JEI 为可选依赖：只编译其 API，用于在锻造页显示类型配方
    compileOnly "mezz.jei:jei-1.20.1-forge-api:${jei_version}"
    if (jei_dev_runtime.toBoolean()) {
        localRuntime "mezz.jei:jei-1.20.1-forge:${jei_version}"
    }
    // Forge 1.20.1 的 Mixin refmap 由注解处理器生成
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

// mods.toml 占位符展开（Forge 元数据直接位于 resources 下）
var modMetadataProps = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        forge_version          : forge_version,
        forge_version_range    : forge_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        // 包内版本号恒带 +build.<编号>，用 gradle 的 version 而非 mod_version
        mod_version            : version,
        mod_authors            : mod_authors,
        mod_description        : mod_description,
        mod_credits            : mod_credits,
        mod_url                : mod_url,
]

tasks.named('processResources', ProcessResources).configure {
    inputs.properties modMetadataProps
    filteringCharset = 'UTF-8'
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand modMetadataProps
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('jar', Jar).configure {
    manifest.attributes('MixinConfigs': "${mod_id}.mixins.json")
}

// 对外发布用正式版本号，不带 +build.<编号>；置 maven_publish_release_version=false 才沿用带编号版本
def publishReleaseVersion = (project.findProperty('maven_publish_release_version') ?: 'true').toBoolean()
def publishVersion = publishReleaseVersion ? baseVersion : version

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
            version = publishVersion
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// 打包收尾：最终包改名到 libs 顶层，原包（带编号）挪进 libs/origin
import java.nio.file.Files
import java.nio.file.StandardCopyOption

tasks.register('finalizeArtifacts') {
    group = 'build'
    description = '整理 build/libs：最终包改名，原包挪进 origin 子目录'
    def libsDir = layout.buildDirectory.dir('libs').get().asFile
    def modId = mod_id
    def modVersion = version
    def releaseVersion = isAlphaBuild ? version : baseVersion
    doLast {
        def builtJar = new File(libsDir, "${modId}-${modVersion}.jar")
        def backupJar = new File(new File(libsDir, 'origin'), "${modId}-${modVersion}-origin.jar")
        if (releaseVersion != modVersion) {
            // 最终包与原包内容一致，只是名字不带编号；原包上一轮可能已搬进 origin，就从那里取
            def source = builtJar.exists() ? builtJar : backupJar
            if (source.exists()) {
                Files.copy(source.toPath(), new File(libsDir, "${modId}-${releaseVersion}.jar").toPath(), StandardCopyOption.REPLACE_EXISTING)
                if (source == builtJar) {
                    backupJar.parentFile.mkdirs()
                    Files.move(builtJar.toPath(), backupJar.toPath(), StandardCopyOption.REPLACE_EXISTING)
                }
            }
        } else if (!builtJar.exists() && backupJar.exists()) {
            // buildAlpha 的最终包与原包同名，把上一轮搬走的原包取回来
            Files.copy(backupJar.toPath(), builtJar.toPath(), StandardCopyOption.REPLACE_EXISTING)
        }
    }
}

tasks.named('build') { finalizedBy 'finalizeArtifacts' }

// 与 build 完全相同，只是编号 +1 并把该编号同步回 gradle.properties
tasks.register('buildAlpha') {
    group = 'build'
    description = '打成 alpha 包，产物版本号带 +build.<编号>，构建成功后把该编号同步回 gradle.properties'
    dependsOn 'build'
    def propsFile = layout.projectDirectory.file('gradle.properties').asFile
    def buildNumberBefore = mod_build_number
    def buildNumberUsed = buildNumber
    doLast {
        def text = propsFile.getText('UTF-8')
        def matcher = (text =~ '(?m)^mod_build_number=\\s*(\\d+)\\s*$')
        if (!matcher.find()) {
            logger.warn('mod_build_number not found in gradle.properties, skipped sync')
            return
        }
        propsFile.setText(
                text.replaceFirst('(?m)^mod_build_number=\\s*\\d+\\s*$', "mod_build_number=${buildNumberUsed}"),
                'UTF-8')
        logger.lifecycle("mod_build_number synced: ${buildNumberBefore} -> ${buildNumberUsed}")
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
